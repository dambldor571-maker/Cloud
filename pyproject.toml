[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vigil"
version = "0.1.0"
description = "Edge-система спостереження: детекція рухомих об'єктів з аналогової камери"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vigil = "vigil.__main__:main"

[tool.setuptools]
packages = ["vigil"]

[tool.pytest.ini_options]
testpaths = ["tests"]
