name: Unit Workshop (Windows)

# Pushes that touch the program only check that it loads. The Windows build is
# made and published only when started by hand, after the owner agrees.
on:
  push:
    paths:
      - "apps/unit_workshop/**"
      - "tools/models/weathered.gdshader"
      - ".github/workflows/unit_workshop.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_BIN: Godot_v4.3-stable_linux.x86_64
  GODOT_URL: https://github.com/godotengine/godot/releases/download/4.3-stable

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and Windows export templates
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-4.3-stable-windows

      - name: Download Godot and Windows export templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -sSL -o godot.zip "$GODOT_URL/$GODOT_BIN.zip"
          unzip -q godot.zip && rm godot.zip
          curl -sSL -o tpl.tpz "$GODOT_URL/Godot_v4.3-stable_export_templates.tpz"
          T=~/.local/share/godot/export_templates/4.3.stable
          mkdir -p "$T"
          unzip -q tpl.tpz 'templates/windows_*x86_64*' 'templates/version.txt' -d x
          mv x/templates/* "$T/" && rm -rf x tpl.tpz

      - name: Load check
        working-directory: apps/unit_workshop
        run: |
          ~/godot/$GODOT_BIN --headless --path . --import 2>&1 | tee import.log || true
          ~/godot/$GODOT_BIN --headless --path . --quit-after 30 2>&1 | tee run.log
          ! grep -E "SCRIPT ERROR|Parse Error|Failed to load script" import.log run.log

      - name: Export UnitWorkshop.exe
        if: github.event_name == 'workflow_dispatch'
        working-directory: apps/unit_workshop
        run: |
          mkdir -p build
          ~/godot/$GODOT_BIN --headless --path . --export-release "Windows Desktop" build/UnitWorkshop.exe
          cd build && zip -q ../UnitWorkshop.zip UnitWorkshop*.exe && ls -la

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: unit-workshop
          path: apps/unit_workshop/UnitWorkshop.zip

      - name: Publish as "unit-workshop" release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete unit-workshop --yes --cleanup-tag || true
          gh release create unit-workshop apps/unit_workshop/UnitWorkshop.zip \
            --prerelease --target "$GITHUB_SHA" \
            --title "Майстерня юнітів для Windows (${GITHUB_REF_NAME})" \
            --notes "Збірка з гілки ${GITHUB_REF_NAME}, коміт ${GITHUB_SHA::7}. Розпакуйте UnitWorkshop.zip і запустіть UnitWorkshop.exe."
