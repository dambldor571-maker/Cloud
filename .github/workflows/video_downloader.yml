name: Video Downloader APK

# Pushes that touch the app only build it and run the unit tests. The APK is
# published only when started by hand (Actions → Video Downloader APK → Run workflow).
on:
  push:
    paths:
      - "apps/video_downloader/**"
      - ".github/workflows/video_downloader.yml"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: apps/video_downloader

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk video-downloader.apk

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: video-downloader-apk
          path: apps/video_downloader/video-downloader.apk

      - name: Publish as "video-downloader-latest" release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete video-downloader-latest --yes --cleanup-tag || true
          gh release create video-downloader-latest video-downloader.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "Завантажувач відео (${GITHUB_REF_NAME})" \
            --notes "Збірка з гілки ${GITHUB_REF_NAME}, коміт ${GITHUB_SHA::7}. Завантажте video-downloader.apk на телефон і встановіть."
